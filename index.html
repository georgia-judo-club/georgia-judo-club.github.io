<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Judo Club Georgia</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600&text=%E6%9F%94%E9%81%93&display=swap">
<style>
/* fluid canvas: mockup D is a 1440px design; above 900px 1rem = 100vw/90 (16px at 1440), capped */
html{font-size:16px}
@media (min-width:900px){html{font-size:clamp(12px,calc(100vw / 90),25.6px)}}
:root{
 --navy:#0F1B33;--navy2:#172848;--navy3:#0A1326;--w:#FFFFFF;--sf:#F2F4F8;--ink:#0F1B33;
 --red:#DD2324;--red2:#B8191A;--redT:#C81D1E;--redL:#FF6B6C;
 --mu:#4F5869;--muD:#AEB7C8;--ln:rgba(15,27,51,.13);--lnD:rgba(255,255,255,.14);
 --fd:"Montserrat","Noto Sans Georgian",system-ui,sans-serif;
 --fb:"Inter","Noto Sans Georgian",system-ui,sans-serif;
 --g:max(20px,3.75rem,env(safe-area-inset-left));
 --hh:5rem;--e:cubic-bezier(.16,1,.3,1);--sp:3rem;--r:.75rem;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 12px)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{margin:0;background:var(--w);color:var(--ink);font:400 1rem/1.6 var(--fb);-webkit-font-smoothing:antialiased;overflow-x:clip}
img,svg,video{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.nv :focus-visible,.rd :focus-visible,.ftr :focus-visible,.hdr :focus-visible,.jb :focus-visible{outline-color:#fff}
.wrap{width:min(100% - 2*var(--g),82.5rem);margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.nv{background:var(--navy);color:#fff}
.sf{background:var(--sf)}
.sec{padding-block:var(--sp)}

/* type: heavy caps for Latin/Cyrillic; Georgian stays mixed-case, never tracked */
.d{font-family:var(--fd);font-weight:900;line-height:1;letter-spacing:-.02em;text-transform:uppercase}
:lang(ka) .d{font-family:"Noto Sans Georgian",sans-serif;font-weight:900;line-height:1.15;letter-spacing:0;text-transform:none}
.n{font-family:"Montserrat",sans-serif!important;font-weight:900;letter-spacing:-.03em;text-transform:none!important;font-variant-numeric:tabular-nums}
.kk{font:600 .72rem/1.5 var(--fb);letter-spacing:.32em;text-transform:uppercase;color:var(--mu)}
.nv .kk{color:#C9D1DF}
:lang(ka) .kk{letter-spacing:0;text-transform:none;font-size:.8rem}
.h2{font-size:2.75rem}
:lang(ka) .h2{font-size:2rem}
.lead2{margin-top:.75rem;color:var(--mu);max-width:34ch;font-size:.95rem}
.nv .lead2{color:#D5DBE6}
.mu{color:var(--mu)}
.nv .mu{color:var(--muD)}
.badge{display:inline-block;vertical-align:middle;margin-left:.5rem;padding:.1rem .5rem;border-radius:99px;background:#FFE7E7;color:#8E1213;font:600 .7rem/1.5 var(--fb);letter-spacing:0;text-transform:none;white-space:nowrap}
.nv .badge,.cc .badge,.sw .badge{background:#3A1A26;color:#FFC9C9}
.ph{font-style:italic;color:var(--mu);border-bottom:1px dashed currentColor}
.nv .ph,.cc .ph,.sw .ph{color:var(--muD)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.75rem;min-height:3.1rem;padding:0 1.6rem;border:2px solid transparent;border-radius:99px;font:700 .95rem/1.1 var(--fb);text-decoration:none;white-space:nowrap;transition:background .3s,color .3s,border-color .3s}
.btn svg{transition:transform .35s var(--e)}
.btn:hover svg{transform:translateX(4px)}
.b-red{background:var(--red);color:#fff}
.b-red:hover{background:var(--red2)}
.b-o{border-color:rgba(255,255,255,.7);color:#fff;background:transparent}
.b-o:hover{background:#fff;color:var(--navy);border-color:#fff}
.b-w{background:#fff;color:var(--navy)}
.b-w:hover{background:var(--navy);color:#fff}
.pc-i{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;border:1.5px solid currentColor}
.lk{display:inline-flex;align-items:center;gap:.6rem;font-weight:700;font-size:.95rem;color:var(--redT);text-decoration:none}
.lk svg{transition:transform .35s var(--e)}
.lk:hover svg{transform:translateX(5px)}
.nv .lk{color:var(--redL)}
.mag{will-change:transform}
.arr{flex:none;display:grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--navy);color:#fff;transition:background .3s,transform .4s var(--e)}
.arr svg{width:45%;height:auto}
.arr.o{background:transparent;border:1.5px solid #fff}

/* header */
.hdr{position:sticky;top:0;z-index:50;height:var(--hh);background:rgba(15,27,51,.96);backdrop-filter:blur(12px);color:#fff;border-bottom:1px solid transparent;transition:border-color .3s}
.hdr.solid{border-bottom-color:var(--lnD)}
.bar{height:100%;display:flex;align-items:center;gap:1.5rem}
.wm{display:flex;align-items:center;gap:.7rem;text-decoration:none;flex:none}
.wm img{width:3.2rem;height:auto}
.wm b{display:block;font:900 1rem/1.05 var(--fd);text-transform:uppercase}
.wm small{display:block;margin-top:.25rem;font:600 .55rem/1.2 var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--muD)}
:lang(ka) .wm b{font-family:"Noto Sans Georgian";text-transform:none;font-size:.9rem}
:lang(ka) .wm small{letter-spacing:0;text-transform:none;font-size:.6rem}
.nav{flex:1;min-width:0;display:flex;justify-content:center;gap:.15rem;overflow:hidden}
.nav a{padding:.6rem .55rem;font-size:.86rem;font-weight:600;text-decoration:none;white-space:nowrap;position:relative;color:#E9EDF4}
:lang(ka) .nav a{font-size:.8rem;padding-inline:.45rem}
.nav a::after{content:"";position:absolute;left:.55rem;right:.55rem;bottom:.2rem;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--e)}
.nav a:hover::after,.nav a[aria-current]::after{transform:none}
.langs{display:flex;flex:none;gap:.1rem}
.langs button{background:none;border:0;padding:.5rem .45rem;font:600 .75rem/1 var(--fb);letter-spacing:.08em;color:var(--muD);position:relative}
.langs button[aria-pressed=true]{color:#fff}
.langs button[aria-pressed=true]::after{content:"";position:absolute;left:.45rem;right:.45rem;bottom:1px;height:2px;background:var(--red)}
.trial{flex:none;min-height:2.75rem;padding:0 1.4rem;font-size:.9rem}
.menu-btn{display:none;flex:none;background:none;border:1px solid var(--lnD);border-radius:99px;height:44px;padding:0 16px;font-weight:700;font-size:13px;color:#fff}
.hdr.compact .nav{display:none;position:absolute;top:var(--hh);left:0;right:0;flex-direction:column;padding:8px var(--g) 24px;background:var(--navy);border-bottom:1px solid var(--lnD)}
.hdr.compact .nav.open{display:flex}
.hdr.compact .nav a{padding:14px 0;border-bottom:1px solid var(--lnD);font-size:18px}
.hdr.compact .nav a::after{display:none}
.hdr.compact .nav a[aria-current]{color:var(--redL)}
.hdr.compact .menu-btn{display:block}
.hdr.compact .wm{margin-right:auto}
.fab{display:none}

/* hero: the mockup's two-column composition at every desktop size */
.hero{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-rows:minmax(0,1fr) auto;height:min(calc(100svh - var(--hh)),35rem);
 background:radial-gradient(60% 75% at 66% 45%,#1C3160 0,rgba(28,49,96,0) 70%),linear-gradient(160deg,#122242,#0B1429 70%)}
.hero-g{display:grid;grid-template-columns:26rem minmax(0,1fr) 7.5rem;align-items:center;min-height:0}
.hero-t{position:relative;z-index:3;padding-bottom:.6rem}
.hero-t .kk{font-size:.64rem}
.hero .btn{min-height:2.7rem;padding:0 1.35rem;font-size:.86rem}
.h1{margin-top:.8rem}
.h1 .ln{display:block;overflow:hidden;padding-bottom:.02em}
.h1 .ln>span{display:block}
.h1 .l1{font-size:6.6rem;line-height:.9}
.h1 .l2{font-size:3.4rem;color:var(--red);line-height:1.02}
:lang(ru) .h1 .l1{font-size:5.9rem}
:lang(ru) .h1 .l2{font-size:2.3rem}
:lang(ka) .h1 .l1{font-size:4.5rem;line-height:1.1}
:lang(ka) .h1 .l2{font-size:2.9rem;line-height:1.15}
.hero .lead{margin-top:1rem;max-width:23rem;font-size:.95rem;line-height:1.5;color:#E2E7F0}
.hero .cta{margin-top:1.35rem;display:flex;flex-wrap:wrap;gap:.9rem}
.hero-a{position:relative;align-self:stretch}
.sun-w{position:absolute;left:52%;top:47%;width:22rem;aspect-ratio:1;translate:-50% -50%}
.sun{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F23A3B,var(--red) 55%,#C41C1D)}
.streak{position:absolute;left:28%;top:-4%;width:110%;height:108%;background:repeating-linear-gradient(90deg,rgba(221,35,36,.55) 0 2px,transparent 2px 1.6rem);transform:skewX(-34deg);-webkit-mask:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);opacity:.75}
/* 640px source: never render above ~1.25x */
.throw{position:absolute;right:-3%;bottom:-11%;width:min(136%,800px);max-width:none;height:auto;filter:drop-shadow(0 1.8rem 2.4rem rgba(5,10,25,.55))}
.hero-r{align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1.15rem;text-align:right;z-index:3}
.kanji{font:600 2.8rem/1.08 "Noto Serif JP",serif;writing-mode:vertical-rl;color:#E8ECF3}
.vals li{white-space:nowrap;font:600 .64rem/2.15 var(--fb);letter-spacing:.3em;text-transform:uppercase;color:#C3CBDA}
:lang(ka) .vals li{letter-spacing:0;text-transform:none;font-size:.8rem}
.plus{width:1.25rem;height:1.25rem;background:linear-gradient(var(--red),var(--red)) center/100% 3px no-repeat,linear-gradient(var(--red),var(--red)) center/3px 100% no-repeat}

/* marquee */
.mq{overflow:hidden;border-top:1px solid var(--lnD);background:rgba(8,15,32,.6);color:#fff;position:relative;z-index:3}
.mq-t{display:flex;width:max-content;animation:mq 46s linear infinite}
.mq span{display:flex;align-items:center;gap:1rem;padding:.65rem .5rem;font:800 .78rem/1 var(--fd);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
:lang(ka) .mq span{font-family:"Noto Sans Georgian";text-transform:none;letter-spacing:0}
.mq i{width:.45rem;height:.45rem;border-radius:50%;background:var(--red)}
@keyframes mq{to{transform:translateX(-50%)}}

/* section heads */
.shd{display:flex;flex-direction:column;gap:.55rem}
.shd .lk{margin-top:1rem}

/* programmes + schedule widget */
.pg{display:grid;grid-template-columns:minmax(0,1fr) 23.5rem;gap:1.5rem;align-items:stretch}
.pg-h{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1rem 2rem;align-items:end;margin-bottom:1.75rem}
.pg-h .lk{margin-top:.9rem}
.pg-h .h2{max-width:11ch}
:lang(ka) .pg-h .h2{max-width:none}
.pg-h .mu{font-size:.95rem}
.pcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.25rem}
.pc{display:flex;flex-direction:column;background:var(--sf);border-radius:var(--r);overflow:hidden;text-decoration:none;transition:transform .5s var(--e),box-shadow .5s var(--e)}
.pc:hover{transform:translateY(-6px);box-shadow:0 1.5rem 3rem rgba(15,27,51,.14)}
.pc .im{aspect-ratio:1.62;overflow:hidden;background:var(--navy)}
.pc .im img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--e)}
.pc:hover .im img,.st:hover .im img,.vc:hover .im img{transform:scale(1.07)}
.pc .bd{padding:1rem 1.1rem 1.2rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.15rem .75rem;align-items:start}
.pc h3{font:900 1.2rem/1.15 var(--fd);text-transform:uppercase;letter-spacing:-.01em}
:lang(ka) .pc h3{font-family:"Noto Sans Georgian";text-transform:none;letter-spacing:0;font-size:1.05rem}
.pc .ag{grid-column:1;font-weight:600;color:var(--mu);font-size:.85rem}
.pc .arr{grid-row:1/3;grid-column:2;align-self:center}
.pc:hover .arr{background:var(--red);transform:translateX(3px)}
.pc p{grid-column:1/-1;margin-top:.6rem;font-size:.82rem;color:#36404F;line-height:1.5}
.sw{background:var(--navy);color:#fff;border-radius:var(--r);padding:1.4rem 1.5rem;display:flex;flex-direction:column;box-shadow:0 1.8rem 3.6rem rgba(15,27,51,.25)}
.sw h3{display:flex;align-items:center;gap:.7rem;font:900 .95rem/1.2 var(--fd);text-transform:uppercase;letter-spacing:.02em}
:lang(ka) .sw h3{font-family:"Noto Sans Georgian";text-transform:none;letter-spacing:0}
.sw h3 svg{color:var(--redL);width:1.3rem;height:1.3rem}
.sw-d{margin-top:1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding-bottom:.6rem;border-bottom:1px solid var(--lnD);font-weight:700;font-size:.9rem}
.sw-d .tt{color:var(--redL);font-weight:600;font-size:.85em;margin-left:.5rem}
.sw-n{display:flex;gap:.4rem}
.sw-n button{width:1.9rem;height:1.9rem;border-radius:50%;border:1px solid var(--lnD);background:transparent;color:#fff;display:grid;place-items:center;font-size:1rem;line-height:1}
.sw-n button:hover{background:#fff;color:var(--navy)}
.sw ul{flex:1;display:flex;flex-direction:column}
.wr{display:grid;grid-template-columns:3.1rem minmax(0,1fr);gap:.6rem;align-items:baseline;padding:.5rem .2rem;border-bottom:1px solid var(--lnD);text-decoration:none;font-size:.85rem;transition:background .3s}
.wr:hover{background:rgba(255,255,255,.06)}
.wr i{display:block;font-style:normal;font-weight:600}
.wr small{display:block;font-size:.7rem;color:var(--muD);line-height:1.35;margin-top:.1rem}
.sw .rest,.wday .rest{padding:1rem .2rem;color:var(--muD)}
.sw .btn{margin-top:1rem}
.wr b{font-variant-numeric:tabular-nums;font-weight:700}
.wr .badge{margin-left:.3rem}
.sw .ft{margin:.7rem 0 1rem;font-size:.72rem;color:var(--muD)}
.sw .btn{width:100%;min-height:2.6rem}

/* coaches band */
.cb{display:grid;grid-template-columns:minmax(0,1fr) 24rem;gap:1.8rem 3rem;align-items:end}
.cgs{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.9rem}
.cc{display:flex;flex-direction:column;text-align:left;border:1px solid var(--lnD);background:var(--navy2);border-radius:var(--r);overflow:hidden;color:#fff;padding:0;transition:transform .5s var(--e),border-color .3s}
.cc:hover{transform:translateY(-6px);border-color:rgba(255,107,108,.6)}
.mono-p{position:relative;aspect-ratio:2.3;overflow:hidden;background:radial-gradient(90% 80% at 50% 110%,#26407A,#13213F 70%);display:grid;place-items:center}
.mono-p::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:var(--red);right:-18%;top:-26%;opacity:.9;transition:transform .8s var(--e)}
.cc:hover .mono-p::before{transform:scale(1.12)}
.mono-p .ini{position:relative;font:900 2.8rem/1 var(--fd);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:2px #fff}
.mono-p .ini.f{color:#fff;-webkit-text-stroke:0}
.mono-p .cap{position:absolute;left:.7rem;bottom:.5rem;font-size:.62rem;color:var(--muD)}
.cc .bd{padding:.85rem 1rem 1rem;display:flex;flex-direction:column;gap:.15rem}
.cc .nm{font-weight:800;font-size:.95rem;line-height:1.3}
.cc .role{color:var(--redL);font-weight:600;font-size:.78rem}
.cc .rk{margin-top:.4rem;font-size:.72rem;color:#C9D0DD;line-height:1.45;font-variant-numeric:tabular-nums}
.cc .fx{margin-top:.35rem;font-size:.7rem;color:var(--muD);line-height:1.4}
.qt{border-left:3px solid var(--red);padding-left:1.3rem}
.qt .qm{font:900 3.4rem/.6 Georgia,serif;color:var(--red);display:block;margin-bottom:.6rem}
.qt blockquote{font:600 1.2rem/1.4 var(--fb)}
.qt cite{display:block;margin-top:1rem;font-style:normal}
.qt cite a{color:var(--muD)}

/* split rows: stories, videos, numbers */
.split{display:grid;grid-template-columns:22rem minmax(0,1fr);gap:2.5rem;align-items:center}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem}
.st{position:relative;display:block;border-radius:var(--r);overflow:hidden;text-decoration:none;color:#fff;background:var(--navy)}
.st .im{aspect-ratio:1.36;overflow:hidden}
.st .im img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--e)}
.st::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,19,38,0) 35%,rgba(10,19,38,.92));pointer-events:none}
.st .ov{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:1rem;display:flex;align-items:flex-end;gap:.8rem}
.st .ov div{flex:1;min-width:0}
.st time{display:block;font-size:.7rem;color:#D5DBE6;margin-bottom:.2rem}
.st h3{font:700 .92rem/1.3 var(--fb);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st .kd{position:absolute;left:.7rem;top:.7rem;z-index:2;background:#fff;color:var(--navy);padding:.35rem .6rem;border-radius:99px;font:700 .7rem/1 var(--fb)}
.st .kd.r{background:var(--red);color:#fff}
.st:hover .arr{background:var(--red);border-color:var(--red)}
.sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.1rem}
.sg .st .im{aspect-ratio:4/5}
.vc{position:relative;display:block;border-radius:var(--r);overflow:hidden;text-decoration:none;color:#fff;border:1px solid var(--lnD);background:var(--navy2)}
.vc .im{aspect-ratio:1.55;overflow:hidden;position:relative}
.vc .im img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--e)}
.vc .im::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,19,38,.05) 40%,rgba(10,19,38,.9))}
.vc .ds{position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,var(--red) 0 18%,transparent 18.5%),var(--navy2)}
.vc .pl{position:absolute;left:50%;top:44%;z-index:2;translate:-50% -50%;width:3.2rem;height:3.2rem;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid #fff;backdrop-filter:blur(6px);display:grid;place-items:center;transition:transform .5s var(--e),background .3s}
.vc .pl svg{width:30%;height:auto;margin-left:6%}
.vc:hover .pl{transform:scale(1.12);background:var(--red);border-color:var(--red)}
.vc .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:.7rem;padding:.8rem 1rem}
.vc .cap b{font-size:.88rem;line-height:1.3}
.vc .cap span{flex:none;font-variant-numeric:tabular-nums;font-size:.75rem;color:#D5DBE6}
.vg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.1rem}
.vg .meta{display:block;padding:.7rem 1rem 1rem;font-size:.75rem;color:var(--muD)}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nums li{padding:.3rem 1rem;border-left:1px solid var(--ln);text-align:center}
.nums b{display:flex;justify-content:center;align-items:baseline;font-size:2.5rem;line-height:1}
.nums b .s{color:var(--red)}
.nums li>span{display:block;margin-top:.5rem;font-size:.8rem;color:var(--mu);line-height:1.4}

/* join band */
.jb{position:relative;overflow:hidden;background:var(--red);color:#fff;isolation:isolate}
.jb>video,.jb>img.bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;filter:grayscale(1) contrast(1.2);mix-blend-mode:multiply;z-index:-1}
.jb::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(221,35,36,.92) 30%,rgba(221,35,36,.55))}
.jb-g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem 4rem;align-items:center;padding-block:2.4rem}
.jb .h2{font-size:2.3rem}
:lang(ka) .jb .h2{font-size:1.7rem}

/* pages */
function ptitleH(h, p, eb) { return `<div class="pt"><div class="wrap">${kk(eb)}<h1 class="d${h.length > 24 ? " long" : ""}">${esc(h)}</h1>${p ? `<p class="sub">${P(p)}</p>` : ""}</div></div>`; }
function pHome() { return sHero() + sPrograms() + sCoaches() + sStories() + sVideos() + sNumbers() + sJoin(); }
function pPrograms() {

   <div><h2 class="d">${esc(L(p.name))}${B(p.conf)}</h2><p>${P(L(p.d))}</p>
   ${p.facts.length ? `<dl>${p.facts.map(([k, v, c]) => `<dt>${esc(t()[k])}</dt><dd>${P(L(v))}${c[0] === "d" ? DB(+c[1]) + DQ(+c[1]) : B(c)}</dd>`).join("")}</dl>` : ""}
   ${jbtn(`${t().waProg} ${L(p.name)}`, "btn b-red mag", esc(t().join) + " " + ARROW)}</div></article>`).join("")}</div></section>` + sJoin();

function pVideos() { return ptitleH(t().viT, t().viP, x().viEb) + `<section class="sec nv"><div class="wrap"><div class="vg">${DATA.videos.map(v => vcard(v, 1).replace("</a>", `<span class="meta">${vmeta(v)}</span></a>`)).join("")}</div></div></section>` + sJoin(); }

function pStory(id) {

function parseHash() {
  const h = location.hash.slice(1);
  if (Object.hasOwn(T, h)) { setLang(h, true); return; }

/* motion: everything is visible by default; GSAP only adds entrances when allowed */
const MO = !RM && window.gsap && window.ScrollTrigger;
let lenis = null, mm = null;
if (MO) {
  gsap.registerPlugin(ScrollTrigger);
  if (window.Lenis) {
    lenis = new Lenis({lerp: .1});
    lenis.on("scroll", ScrollTrigger.update);
    gsap.ticker.add(tm => lenis.raf(tm * 1000));
    gsap.ticker.lagSmoothing(0);
  }
}
function motion() {
  if (!MO) return;
  if (mm) mm.revert();
  ScrollTrigger.getAll().forEach(s => s.kill());
  mm = gsap.matchMedia();
  mm.add("all", () => {
    if (document.querySelector(".hero")) {
      gsap.from(".h1 .ln>span", {yPercent:110, duration:1.2, stagger:.1, ease:"expo.out", delay:.1});
      gsap.from(".hero-t .kk, .hero .lead, .hero .cta", {y:24, opacity:0, duration:1, stagger:.1, ease:"expo.out", delay:.35});
      gsap.from(".sun", {scale:.5, opacity:0, duration:1.5, ease:"expo.out"});
      gsap.from(".streak", {xPercent:-30, opacity:0, duration:1.6, ease:"expo.out", delay:.2});
      gsap.from(".throw", {x:80, rotate:8, opacity:0, duration:1.4, ease:"expo.out", delay:.25});
      gsap.from(".hero-r > *", {y:30, opacity:0, duration:1, stagger:.1, ease:"expo.out", delay:.5});
      // the sun breathes slowly; scroll adds a gentle parallax split between sun and throw
      gsap.to(".sun", {scale:1.035, duration:3.6, ease:"sine.inOut", yoyo:true, repeat:-1, delay:1.5});
      gsap.to(".sun-w", {yPercent:-10, ease:"none", scrollTrigger:{trigger:".hero", start:"top top", end:"bottom top", scrub:true}});
      gsap.to(".throw", {yPercent:-12, xPercent:4, ease:"none", scrollTrigger:{trigger:".hero", start:"top top", end:"bottom top", scrub:true}});
      gsap.to(".kanji", {yPercent:30, ease:"none", scrollTrigger:{trigger:".hero", start:"top top", end:"bottom top", scrub:true}});
    }
    document.querySelectorAll(".pt h1, .pt .kk, .pt .sub").forEach((el, i) => gsap.from(el, {y:30, opacity:0, duration:1, delay:.08 * i, ease:"expo.out"}));
    ScrollTrigger.batch(".rv", {start:"top 90%", once:true, onEnter:els => {
      // CSS transform transitions on cards fight the tween and leave them offset
      gsap.set(els, {transition:"none"});
      gsap.from(els, {y:46, opacity:0, duration:1, stagger:.09, ease:"expo.out", onComplete:() => gsap.set(els, {clearProps:"transition,transform,opacity"})});
    }});
    document.querySelectorAll(".cnt").forEach(el => {
      const o = {v:+el.dataset.from};
      gsap.to(o, {v:+el.dataset.to, duration:2, ease:"power3.out", snap:{v:1}, onUpdate:() => { el.textContent = o.v; }, scrollTrigger:{trigger:el, start:"top 92%", once:true}});
    });
  });
  ScrollTrigger.refresh();
}
// magnetic CTAs on fine pointers only
if (MO && matchMedia("(pointer: fine)").matches) {
  document.addEventListener("pointermove", e => {
    const m = e.target.closest && e.target.closest(".mag");
    document.querySelectorAll(".mag.pull").forEach(el => { if (el !== m) { el.classList.remove("pull"); gsap.to(el, {x:0, y:0, duration:.6, ease:"elastic.out(1,.4)"}); } });
    if (!m) return;
    const r = m.getBoundingClientRect();
    m.classList.add("pull");
    gsap.to(m, {x:(e.clientX - r.left - r.width / 2) * .3, y:(e.clientY - r.top - r.height / 2) * .4, duration:.4, ease:"power3.out"});
  });
}
// pause loops that are off-screen
const vio = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause(); }), {threshold:.15}) : null;
function videos() { if (vio) document.querySelectorAll("video").forEach(v => vio.observe(v)); }

/* render + events */
function hdrState() {
  const h = document.getElementById("hdr"), n = document.getElementById("nav");
  if (!h) return;
  h.classList.toggle("solid", scrollY > 20);
  h.classList.remove("compact");
  const bar = h.querySelector(".bar");
  if (n.scrollWidth > n.clientWidth + 1 || bar.scrollWidth > bar.clientWidth + 1) h.classList.add("compact");
}
function render(keepFocus) {
  document.documentElement.lang = lang;
  if (vio) vio.disconnect();
  document.getElementById("app").innerHTML = header() + `<main id="main">${page()}</main>` + footer();
  hdrState(); videos(); motion();
  if (keepFocus) { const el = document.querySelector(keepFocus); if (el) el.focus(); }
}
function toTop() { lenis ? lenis.scrollTo(0, {immediate:true}) : scrollTo(0, 0); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-lang],[data-join],[data-coach],[data-wd],[data-pd],[data-menu],[data-close],[data-copy]");
  if (!el) { if (e.target.closest(".nav.open a")) document.getElementById("nav").classList.remove("open"); return; }
  if (el.dataset.lang) { setLang(el.dataset.lang); render(`[data-lang="${lang}"]`); return; }
  if (el.dataset.join !== undefined) { e.preventDefault(); openJoin(el.dataset.join); return; }
  if (el.dataset.coach) { openCoach(el.dataset.coach); return; }
  if (el.dataset.wd) { day = (day + +el.dataset.wd + 7) % 7; const wg = document.querySelector("[data-widget]"); wg.innerHTML = widget(); wg.querySelector(`[data-wd="${el.dataset.wd}"]`).focus(); return; }
  if (el.dataset.pd) { pday = +el.dataset.pd; const sc = document.querySelector("[data-sched]"); sc.innerHTML = weekView(); sc.querySelector(`[data-pd="${pday}"]`).focus(); return; }
  if (el.hasAttribute("data-menu")) { const n = document.getElementById("nav"), o = n.classList.toggle("open"); el.setAttribute("aria-expanded", o); return; }
  if (el.hasAttribute("data-close")) { dlg.close(); return; }
  if (el.hasAttribute("data-copy")) {
    const ta = document.getElementById("jmsg"), stt = document.getElementById("cst");
    const done = () => { stt.textContent = t().copied; };
    try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); try { document.execCommand("copy"); done(); } catch (x_) {} }); }
    catch (x_) { ta.select(); }
  }
});
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
addEventListener("hashchange", () => { parseHash(); render(); toTop(); });
addEventListener("scroll", () => { const h = document.getElementById("hdr"); if (h) h.classList.toggle("solid", scrollY > 20); }, {passive:true});
addEventListener("resize", hdrState);
if (document.fonts) document.fonts.ready.then(() => { hdrState(); if (MO) ScrollTrigger.refresh(); });
addEventListener("load", () => { if (MO) ScrollTrigger.refresh(); });
addEventListener("keydown", e => {
  const n = document.getElementById("nav");
  if (e.key === "Escape" && n && n.classList.contains("open")) { n.classList.remove("open"); const b = document.querySelector("[data-menu]"); b.setAttribute("aria-expanded", "false"); b.focus(); }
});

parseHash(); render();
</script>
